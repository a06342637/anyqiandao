name: Validate and publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.txt
      - run: python tools/verify_source_privacy.py
      - run: python tools/verify_remote_backup.py
      - run: python tools/verify_privacy.py
      - run: python tools/verify_reverse_proxy.py
      - run: python tools/verify_release_permissions.py
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts && pnpm run build
        working-directory: frontend
      - name: Validate tag and build archive
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          fi
          python scripts/build_release.py
      - name: Build and smoke-test extracted release as container user
        shell: bash
        run: |
          umask 077
          python - <<'PY'
          from pathlib import Path
          from app.update_common import extract_source
          version = Path('VERSION').read_text().strip()
          extract_source(Path('.release') / f'any-signin-assistant-v{version}.tar.gz', '.release/smoke-source', version)
          PY
          docker build -t anyqiandao:release-check .release/smoke-source
          docker run --rm --network none --read-only --tmpfs /tmp:size=67108864 --entrypoint python anyqiandao:release-check -c 'from app.main import create_app; from app.config import Config; from argon2 import PasswordHasher; from pathlib import Path; app=create_app(Config(bytes(range(32)), PasswordHasher().hash("synthetic-image-check"), Path("/tmp/check"), start_worker=False)); print("App initialized", app.version)'
      - name: Verify old updater health probe and anonymous isolation
        shell: bash
        run: |
          trap 'docker rm -f anyqiandao-readiness-check >/dev/null 2>&1 || true' EXIT
          docker run -d --name anyqiandao-readiness-check --read-only --tmpfs /tmp:size=67108864 -p 127.0.0.1:19888:8000 --entrypoint python anyqiandao:release-check -c 'import uvicorn; from app.main import create_app; from app.config import Config; from argon2 import PasswordHasher; from pathlib import Path; app=create_app(Config(bytes(range(32)), PasswordHasher().hash("synthetic-image-check"), Path("/tmp/check"), "http://127.0.0.1:19888", start_worker=False)); uvicorn.run(app, host="0.0.0.0", port=8000, access_log=False, proxy_headers=False)'
          python - <<'PY'
          import json, time, urllib.request
          from http.cookies import SimpleCookie
          from pathlib import Path
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:19888/healthz', timeout=2) as response:
                      state = json.load(response)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Container did not become ready')
          assert state['version'] == Path('VERSION').read_text().strip(), state
          request = urllib.request.Request('http://127.0.0.1:19888/healthz', headers={'Host': 'example.invalid', 'X-Forwarded-Proto': 'https'})
          with urllib.request.urlopen(request, timeout=5) as response:
              assert json.load(response) == {'status': 'ok'}
          with urllib.request.urlopen('http://127.0.0.1:19888/', timeout=5) as response:
              page = response.read().decode()
              assert '管理员登录' in page and '/assets/' not in page
          print('Old updater health checks and public metadata isolation passed.')
          tunnel_headers = {'Host': 'tunnel.example.invalid', 'Origin': 'https://tunnel.example.invalid',
                            'X-Forwarded-Proto': 'https', 'CF-Visitor': '{"scheme":"https"}', 'Content-Type': 'application/json'}
          request = urllib.request.Request('http://127.0.0.1:19888/api/v1/auth/login',
                      data=json.dumps({'password': 'synthetic-image-check'}).encode(), headers=tunnel_headers)
          with urllib.request.urlopen(request, timeout=5) as response:
              cookies = SimpleCookie(response.headers['Set-Cookie'])
              assert cookies['any_assistant_session']['secure']
              assert response.headers['Strict-Transport-Security']
          tunnel_headers['Cookie'] = 'any_assistant_session=' + cookies['any_assistant_session'].value
          request = urllib.request.Request('http://127.0.0.1:19888/api/v1/auth/me', headers=tunnel_headers)
          with urllib.request.urlopen(request, timeout=5) as response:
              assert json.load(response)['username'] == 'admin'
          print('Tunnel HTTPS, same-origin authentication and Secure cookie checks passed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            .release/*.tar.gz
            .release/release.json
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" .release/*.tar.gz .release/release.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" .release/*.tar.gz .release/release.json --title "$GITHUB_REF_NAME" --generate-notes
          fi
