name: any-signin-assistant
services:
  app:
    image: ${APP_IMAGE:-any-signin-assistant:0.4.0}
    build: .
    init: true
    restart: unless-stopped
    environment:
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://127.0.0.1:18780}
      APP_DATA_DIR: /data
      APP_SECRET_KEY_FILE: /run/secrets/app_key
      APP_ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin_hash
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ALLOW_INSECURE_HTTP: ${APP_ALLOW_INSECURE_HTTP:-0}
      APP_UPDATE_DIR: /run/assistant-update
      APP_UPDATE_REPOSITORY: ${APP_UPDATE_REPOSITORY:-a06342637/anyqiandao}
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-18780}:8000"
    volumes:
      - ./data:/data
      - ./updates/requests:/run/assistant-update/requests
      - ./updates/status:/run/assistant-update/status:ro
    secrets:
      - app_key
      - admin_hash
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
    shm_size: 512mb
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  caddy:
    image: caddy:2.10-alpine
    profiles: [https]
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=33554432,mode=1777
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
secrets:
  app_key:
    file: ./secrets/app.key
  admin_hash:
    file: ./secrets/admin.hash
volumes:
  caddy_data:
  caddy_config:
